services:
  - type: web
    name: tallerplus-api
    runtime: docker
    repo: https://github.com/JEETVP/SistemaBackendVillavisWorkshop
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tallerplus-postgres
          property: connectionString
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: BACKEND_PROXY_TOKEN
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: '43200'
      - key: ACTIVATION_TTL_SECONDS
        value: '86400'
      - key: DB_POOL_MAX_SIZE
        value: '5'

databases:
  - name: tallerplus-postgres
    databaseName: tallerplus
    user: tallerplus
    postgresMajorVersion: '17'
    plan: basic-256mb
    region: oregon
    ipAllowList: []
